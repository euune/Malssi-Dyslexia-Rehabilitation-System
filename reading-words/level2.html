
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>말씨 - 단어 읽기 2단계</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="level1_style.css">
    <link rel="stylesheet" href="level2_style.css">
</head>
<body>

    <!-- 공통 씨앗 성장 상단 바 -->
    <header class="topbar">
        <a class="icon-btn" href="../index.html" aria-label="정원으로">🏡</a>
        <div class="growth">
            <div class="growth-label">
                <span id="seed-name">말씨</span> ·
                <span id="stage-name">아기 씨앗</span>
            </div>
            <div class="growth-bar" role="progressbar" aria-label="씨앗 성장">
                <div id="growth-fill"></div>
            </div>
        </div>
    </header>

    <main class="rw-page">
        <div class="rw-navigation">
            <a href="./select-level.html" class="rw-garden-btn">
                단계화면으로 🏡
            </a>
        </div>

        <div class="rw-level">
            <button id="prevBtn" type="button"
                    class="rw-prev-btn"
                    aria-label="이전 문제" disabled>←</button>

            <div class="rw-level-label">
                단어 읽기 · 2단계 ·
                <span id="progressText">1/3</span>
            </div>

            <div class="rw-level-bar" id="progressBar"
                 role="progressbar"
                 aria-label="단어 학습 진행률"
                 aria-valuemin="0"
                 aria-valuemax="3"
                 aria-valuenow="1">
                <div id="progressFill"></div>
            </div>
        </div>

        <!-- 씨앗 말풍선 -->
        <section class="rw-stage" aria-label="씨앗의 반응">
            <img src="../images/seed.png"
                 alt="씨앗 캐릭터"
                 class="rw-seed-image">

            <p id="result" class="rw-bubble" aria-live="polite">
                이번엔 먼저 혼자 읽어볼까?
            </p>
        </section>

        <!-- 학습 카드 -->
        <section class="rw-card">

            <h1 class="instruction">
                그림과 단어를 보고 스스로 읽어볼까요?
            </h1>

            <div class="image-box">
                <img id="wordImage" alt="단어 그림" hidden>
                <span id="wordEmoji"
                      aria-hidden="true" hidden></span>
            </div>

            <div class="word-area">
                <h2 id="wordText">야구공</h2>
            </div>

            <!-- 간접적인 이미지 피드백 -->
            <section id="feedbackCard"
                     class="rw-feedback-card"
                     aria-label="새로운 단어 발견"
                     hidden>

                <p class="rw-feedback-label">
                    🌼 새로운 단어 발견!
                </p>

                <div class="rw-feedback-body">

                    <div class="rw-feedback-visual">
                        <img id="feedbackImage" alt="" hidden>
                        <span id="feedbackEmoji"
                              aria-hidden="true"></span>
                    </div>

                    <div class="rw-feedback-info">
                        <strong id="feedbackWord"
                                class="rw-feedback-word"></strong>

                        <p id="feedbackExplanation"
                           class="rw-feedback-explanation"></p>
                    </div>

                </div>

                <p class="rw-feedback-note">
                    다른 단어도 발견했네!
                    처음 단어를 다시 읽어볼까?
                </p>

            </section>

            <!-- 스스로 읽기 및 음성 힌트 -->
            <div class="rw-controls">
                <button id="micBtn" type="button" class="mic-btn">
                    🎤 내가 읽어볼게요!
                </button>

                <button id="listenBtn" type="button" class="listen-btn">
                    🔈 힌트를 들어볼까요?
                </button>
            </div>

            <p class="rw-hint-guide">
                잘 몰라도 괜찮아요!
                필요할 때 음성 힌트를 들어보세요.
            </p>

            <button id="nextBtn" type="button" class="next-btn">
                다음으로 넘어가볼까요? →
            </button>

        </section>
    </main>

    <div class="overlay hidden" id="overlay"></div>

    <!-- 공통 JavaScript -->
    <script src="../js/hangul.js"></script>
    <script src="../js/engine.js"></script>
    <script src="../js/store.js"></script>
    <script src="../js/db-config.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/seed.js"></script>
    <script src="../js/growth.js"></script>

    <script>
        if (window.SG && SG.growth) {
            SG.growth.update();
        }
    </script>

    <script src="level2_script.js"></script>

</body>
</html>
