
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>말씨 - 단어 읽기 훈련</title>

    <!-- 글꼴 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap"
          rel="stylesheet">

    <!-- 공통 디자인 -->
    <link rel="stylesheet" href="../css/common.css">

    <!-- 단어 읽기 디자인 -->
    <link rel="stylesheet" href="level1_style.css">
</head>

<body>

    <!-- 상단 바 -->
    <header class="topbar rw-topbar">

        <a href="../index.html"
           class="icon-btn rw-home"
           aria-label="정원으로">
            🏡
        </a>

        <div class="growth rw-growth">

            <div class="growth-label rw-growth-label">
                단어 읽기 ·
                <span id="progressText">1/3</span>
            </div>

            <div class="growth-bar rw-progress-bar"
                 id="progressBar"
                 role="progressbar"
                 aria-label="단어 학습 진행률"
                 aria-valuemin="0"
                 aria-valuemax="3"
                 aria-valuenow="1">

                <div id="progressFill"></div>

            </div>
        </div>
    </header>


    <!-- 메인 화면 -->
    <main class="rw-page">

<!-- 씨앗 캐릭터와 말풍선 -->
<section class="rw-stage" aria-label="씨앗의 반응">

    <!-- 씨앗 이미지 -->
    <img
        src="../images/seed.png"
        alt="꽃이 피어난 씨앗 캐릭터"
        class="rw-seed-image"
    >

    <!-- 씨앗 말풍선 -->
    <p id="result"
       class="rw-bubble"
       aria-live="polite">
        단어를 읽어서 가르쳐줘!!
    </p>

</section>


        <!-- 단어 읽기 카드 -->
        <section class="rw-card">

            <h1 class="instruction">
                씨앗에게 단어를 읽어서 가르쳐주세요!
            </h1>

            <!-- 단어 이미지 -->
            <div class="image-box">

                <img id="wordImage"
                     alt="단어 그림"
                     hidden>

                <span id="wordEmoji"></span>

            </div>


            <!-- 단어 -->
            <div class="word-area">
                <h2 id="wordText">발</h2>
            </div>


            <!-- 음성 버튼 -->
            <div class="rw-controls">

                <button id="listenBtn"
                        type="button"
                        class="listen-btn">
                    🔈 같이 들어볼까요?
                </button>

                <button id="micBtn"
                        type="button"
                        class="mic-btn">
                    🎤 한 번 읽어볼까요?
                </button>

            </div>


            <!-- 다음 단어 -->
            <button id="nextBtn"
                    type="button"
                    class="next-btn">
                다음으로 넘어가볼까요? →
            </button>

        </section>

    </main>

    <!-- JavaScript 연결 -->
    <script src="level1_script.js"></script>

</body>
</html>
